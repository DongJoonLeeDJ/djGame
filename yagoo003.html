<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자야구 게임 (Number Baseball)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Pretendard / Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            touch-action: manipulation;
        }
        /* Custom scrollbar for history log */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Main Container Card -->
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800/80 rounded-3xl shadow-2xl backdrop-blur-xl p-5 sm:p-7 flex flex-col gap-5 relative overflow-hidden">
        
        <!-- Background Glow Effect -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header: Title & Timer -->
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 text-xl">
                    ⚾
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">숫자 야구</h1>
                    <p class="text-xs text-slate-400">3자리 서로 다른 숫자 맞추기</p>
                </div>
            </div>
            <!-- Timer Badge -->
            <div class="flex items-center gap-1.5 bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-full text-xs font-semibold text-indigo-300 shadow-inner">
                <svg class="w-3.5 h-3.5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="time">0.0s</span>
            </div>
        </div>

        <!-- Current Guess Display Screen -->
        <div class="relative group">
            <div id="output" class="w-full h-16 bg-slate-950/80 border-2 border-indigo-500/40 rounded-2xl flex items-center justify-center text-3xl font-bold tracking-[0.5em] text-indigo-200 shadow-inner transition-all duration-200 group-hover:border-indigo-500/70">
                <span class="text-slate-600 text-base tracking-normal font-normal">버튼을 눌러 입력하세요</span>
            </div>
            <!-- Attempt counter badge -->
            <div class="absolute right-3 top-1/2 -translate-y-1/2 bg-slate-800/90 text-slate-400 text-xs px-2.5 py-1 rounded-lg border border-slate-700/50">
                시도: <span id="attempt-count" class="font-bold text-indigo-400">0</span>/9
            </div>
        </div>

        <!-- History Log Box -->
        <div class="flex flex-col gap-1.5">
            <div class="flex justify-between items-center text-xs text-slate-400 px-1 font-medium">
                <span>시도 기록</span>
                <span id="history-hint-status" class="text-indigo-400"></span>
            </div>
            <div id="input-history" class="w-full h-32 bg-slate-950/60 border border-slate-800/70 rounded-2xl p-3 overflow-y-auto flex flex-col gap-2 text-sm">
                <div class="text-slate-500 text-center my-auto italic">아직 시도한 기록이 없습니다.</div>
            </div>
        </div>

        <!-- Number Keypad & Action Buttons Grid -->
        <div class="grid grid-cols-3 gap-2.5">
            <!-- Numbers 1 to 9 -->
            <button class="choiceValue h-14 bg-slate-800/80 hover:bg-slate-700/90 active:scale-95 transition-all rounded-2xl text-xl font-semibold border border-slate-700/50 shadow-md flex items-center justify-center text-white" data-value="1">1</button>
            <button class="choiceValue h-14 bg-slate-800/80 hover:bg-slate-700/90 active:scale-95 transition-all rounded-2xl text-xl font-semibold border border-slate-700/50 shadow-md flex items-center justify-center text-white" data-value="2">2</button>
            <button class="choiceValue h-14 bg-slate-800/80 hover:bg-slate-700/90 active:scale-95 transition-all rounded-2xl text-xl font-semibold border border-slate-700/50 shadow-md flex items-center justify-center text-white" data-value="3">3</button>
            <button class="choiceValue h-14 bg-slate-800/80 hover:bg-slate-700/90 active:scale-95 transition-all rounded-2xl text-xl font-semibold border border-slate-700/50 shadow-md flex items-center justify-center text-white" data-value="4">4</button>
            <button class="choiceValue h-14 bg-slate-800/80 hover:bg-slate-700/90 active:scale-95 transition-all rounded-2xl text-xl font-semibold border border-slate-700/50 shadow-md flex items-center justify-center text-white" data-value="5">5</button>
            <button class="choiceValue h-14 bg-slate-800/80 hover:bg-slate-700/90 active:scale-95 transition-all rounded-2xl text-xl font-semibold border border-slate-700/50 shadow-md flex items-center justify-center text-white" data-value="6">6</button>
            <button class="choiceValue h-14 bg-slate-800/80 hover:bg-slate-700/90 active:scale-95 transition-all rounded-2xl text-xl font-semibold border border-slate-700/50 shadow-md flex items-center justify-center text-white" data-value="7">7</button>
            <button class="choiceValue h-14 bg-slate-800/80 hover:bg-slate-700/90 active:scale-95 transition-all rounded-2xl text-xl font-semibold border border-slate-700/50 shadow-md flex items-center justify-center text-white" data-value="8">8</button>
            <button class="choiceValue h-14 bg-slate-800/80 hover:bg-slate-700/90 active:scale-95 transition-all rounded-2xl text-xl font-semibold border border-slate-700/50 shadow-md flex items-center justify-center text-white" data-value="9">9</button>
            
            <!-- Bottom Row: Cancel, 0, Submit -->
            <button id="cancel" class="h-14 bg-rose-950/40 hover:bg-rose-900/40 border border-rose-800/40 active:scale-95 transition-all rounded-2xl font-medium text-rose-300 shadow-md flex items-center justify-center gap-1.5 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                지우기
            </button>
            <button class="choiceValue h-14 bg-slate-800/80 hover:bg-slate-700/90 active:scale-95 transition-all rounded-2xl text-xl font-semibold border border-slate-700/50 shadow-md flex items-center justify-center text-white" data-value="0">0</button>
            <button id="submit" class="h-14 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 border border-indigo-400/30 active:scale-95 transition-all rounded-2xl font-semibold text-white shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-1.5 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                제출
            </button>
        </div>

        <!-- Footer Extras: Answer Reveal & Reset -->
        <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
            <button id="answer" class="text-xs text-slate-400 hover:text-indigo-400 transition-colors py-1 px-3 rounded-lg hover:bg-slate-800/50">
                💡 정답은?
            </button>
            <button id="restart-btn" class="text-xs text-slate-400 hover:text-rose-400 transition-colors py-1 px-3 rounded-lg hover:bg-slate-800/50">
                🔄 새로하기
            </button>
        </div>
    </div>

    <!-- Custom Modal Popup (Replaces alert/confirm) -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col gap-4 text-center">
            <div id="modal-icon" class="w-14 h-14 rounded-2xl bg-indigo-500/20 border border-indigo-500/40 mx-auto flex items-center justify-center text-2xl">
                🏆
            </div>
            <div class="space-y-1">
                <h3 id="modal-title" class="text-lg font-bold text-white">알림</h3>
                <p id="modal-message" class="text-sm text-slate-300 leading-relaxed"></p>
            </div>
            <button id="modal-close-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all rounded-xl font-semibold text-white shadow-lg shadow-indigo-600/30">
                확인
            </button>
        </div>
    </div>

    <script>
        // Game State Variables
        let output = ''; // Correct answer (3 digits string)
        let array = [];
        let count = 0; // Attempt count
        let timecount = 0; // Timer in tenths of a second
        let timeCountInterval = null;

        // DOM Elements
        const h1output = document.getElementById('output');
        const h3input = document.getElementById('input-history');
        const cancelBtn = document.querySelector('#cancel');
        const submitBtn = document.querySelector('#submit');
        const answerBtn = document.getElementById('answer');
        const timeDisplay = document.getElementById('time');
        const attemptCountDisplay = document.getElementById('attempt-count');
        const historyHintStatus = document.getElementById('history-hint-status');
        const restartBtn = document.getElementById('restart-btn');
        const buttons = document.getElementsByClassName('choiceValue');

        // Modal Elements
        const modal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalIcon = document.getElementById('modal-icon');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        function showCustomModal(title, message, iconEmoji = '🏆') {
            modalTitle.innerText = title;
            modalMessage.innerHTML = message;
            modalIcon.innerText = iconEmoji;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);
        }

        function hideCustomModal() {
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        modalCloseBtn.addEventListener('click', hideCustomModal);

        // Generate initial random 3-digit number with unique digits
        function generateAnswer() {
            array = [];
            output = '';
            do {
                let digit = Math.floor(Math.random() * 10);
                if (!array.includes(digit)) {
                    array.push(digit);
                    output += digit;
                }
            } while (array.length < 3);
        }

        // Start Timer
        function startTimer() {
            clearInterval(timeCountInterval);
            timecount = 0;
            timeDisplay.innerText = '0.0s';
            timeCountInterval = setInterval(() => {
                timecount++;
                timeDisplay.innerText = (timecount / 10).toFixed(1) + 's';
            }, 100);
        }

        // Initialize Game
        function initGame() {
            generateAnswer();
            count = 0;
            attemptCountDisplay.innerText = count;
            h1output.innerHTML = '<span class="text-slate-600 text-base tracking-normal font-normal">버튼을 눌러 입력하세요</span>';
            h3input.innerHTML = '<div class="text-slate-500 text-center my-auto italic">아직 시도한 기록이 없습니다.</div>';
            answerBtn.innerHTML = '💡 정답은?';
            historyHintStatus.innerText = '';

            // Reset buttons styling
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].style.color = '';
                buttons[i].disabled = false;
                buttons[i].classList.remove('opacity-40', 'cursor-not-allowed', 'bg-rose-950/20');
            }
            startTimer();
        }

        // Keypad button click handlers
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener('click', function() {
                let val = this.getAttribute('data-value');
                let currentText = h1output.innerText;
                
                // If placeholder is shown, clear it first
                if (currentText.includes('버튼을 눌러 입력하세요')) {
                    h1output.innerText = '';
                    currentText = '';
                }

                if (!currentText.includes(val)) {
                    if (currentText.length < 3) {
                        h1output.innerText += val;
                    }
                }
            });
        }

        // Cancel / Clear button
        cancelBtn.addEventListener('click', function() {
            h1output.innerHTML = '<span class="text-slate-600 text-base tracking-normal font-normal">버튼을 눌러 입력하세요</span>';
            answerBtn.innerHTML = '💡 정답은?';
        });

        // Reveal Answer button
        answerBtn.addEventListener('click', function() {
            this.innerHTML = '💡 정답: ' + output;
        });

        // Restart button
        restartBtn.addEventListener('click', function() {
            initGame();
        });

        // Submit Guess
        submitBtn.addEventListener('click', function() {
            let currentGuess = h1output.innerText;
            if (currentGuess.length !== 3 || currentGuess.includes('버튼')) {
                showCustomModal('입력 오류', '3자리 숫자를 완성해주세요!', '⚠️');
                return;
            }

            count++;
            attemptCountDisplay.innerText = count;

            // Remove placeholder if it was the first entry
            if (h3input.querySelector('.italic')) {
                h3input.innerHTML = '';
            }

            if (output === currentGuess) {
                // Correct Answer!
                clearInterval(timeCountInterval);
                let ratingTitle = timecount < 100 ? '천재 등극! 🧠✨' : '멋진 승리! 🎉';
                let ratingMsg = `정답은 <strong class="text-indigo-300">${output}</strong>입니다!<br>시도 횟수: ${count회}<br>소요 시간: ${(timecount / 10).toFixed(1)}초`;
                showCustomModal(ratingTitle, ratingMsg, '🏆');
                initGame();
                return;
            } else {
                // Calculate Strike and Ball
                let arr = [output[0], output[1], output[2]];
                let ball = 0;
                let strike = 0;

                for (let i = 0; i < 3; i++) {
                    let testIdx = arr.indexOf(currentGuess[i]);
                    if (testIdx !== -1) {
                        if (arr[i] === currentGuess[i]) {
                            strike++;
                        } else {
                            ball++;
                        }
                    }
                }

                let h1Temp = currentGuess;
                let resultBadge = '';

                if (ball === 0 && strike === 0) {
                    resultBadge = `<div class="flex items-center justify-between bg-slate-900/80 border border-slate-800 px-3 py-2 rounded-xl animate-fade-in">
                        <span class="font-mono font-bold tracking-widest text-indigo-200">[ ${currentGuess} ]</span>
                        <span class="px-2 py-0.5 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-xs font-semibold">OUT</span>
                    </div>`;
                } else {
                    resultBadge = `<div class="flex items-center justify-between bg-slate-900/80 border border-slate-800 px-3 py-2 rounded-xl animate-fade-in">
                        <span class="font-mono font-bold tracking-widest text-indigo-200">[ ${currentGuess} ]</span>
                        <div class="flex gap-1.5">
                            ${strike > 0 ? `<span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg text-xs font-semibold">${strike} Strike</span>` : ''}
                            ${ball > 0 ? `<span class="px-2 py-0.5 bg-sky-500/20 text-sky-400 border border-sky-500/30 rounded-lg text-xs font-semibold">${ball} Ball</span>` : ''}
                        </div>
                    </div>`;
                }

                h3input.innerHTML += resultBadge;
                h3input.scrollTop = h3input.scrollHeight;
                h1output.innerHTML = '<span class="text-slate-600 text-base tracking-normal font-normal">버튼을 눌러 입력하세요</span>';

                // Hint logic: Disable incorrect numbers on keypad after specific attempt counts
                if (count === 3 || count === 5 || count === 7 || count === 8) {
                    let hintNum;
                    let checkNumber;
                    do {
                        hintNum = Math.floor(Math.random() * 10);
                        checkNumber = arr.indexOf(hintNum + '');
                    } while (checkNumber !== -1 || buttons[hintNum].style.color === 'red' || buttons[hintNum].disabled);

                    buttons[hintNum].style.color = '#f43f5e';
                    buttons[hintNum].disabled = true;
                    buttons[hintNum].classList.add('opacity-40', 'cursor-not-allowed', 'bg-rose-950/20');
                    historyHintStatus.innerText = `💡 힌트 제공됨 (${hintNum}은 아님)`;
                }

                // Game Over after 9 attempts
                if (count >= 9) {
                    clearInterval(timeCountInterval);
                    showCustomModal('게임 종료', `마지막으로 입력한 ${h1Temp}도 정답이 아닙니다.<br>정답은 <strong class="text-indigo-300">${output}</strong>입니다.`, '💥');
                    initGame();
                }
            }
        });

        // Initialize on load
        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
